name: Build

on:
  push:
  pull_request:

jobs:
  recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bin/check-recipes

  iso-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the patches to omarchy-iso
        run: |
          git clone --quiet https://github.com/omacom-io/omarchy-iso "$RUNNER_TEMP/omarchy-iso"
          cd "$RUNNER_TEMP/omarchy-iso"
          git checkout --quiet "$(cat "$GITHUB_WORKSPACE/iso/OMARCHY_ISO_COMMIT")"
          git -c user.name=ci -c user.email=ci@localhost am --quiet "$GITHUB_WORKSPACE"/iso/patches/*.patch
      # omarchy-iso's own way (.github/workflows/unit-test.yml): Arch with
      # systemd running, for localectl's keymaps, and an ordinary user.
      - name: Run its ./test/all in an Arch container
        run: |
          docker run -d --name unit --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw --tmpfs /run --tmpfs /tmp:exec \
            -v "$RUNNER_TEMP/omarchy-iso:/src:ro" ghcr.io/archlinux/archlinux:latest bash -c '
              systemctl mask getty.target console-getty.service \
                systemd-udev-trigger.service systemd-udevd.service \
                systemd-vconsole-setup.service
              exec /usr/lib/systemd/systemd
            '
          docker exec unit bash -euo pipefail -c '
            for i in $(seq 1 60); do
              state=$(systemctl is-system-running 2>/dev/null || true)
              case $state in running | degraded) break ;; esac
              sleep 1
            done
            for attempt in 1 2 3; do
              pacman -Syu --noconfirm --needed python parted diffutils jq zip unzip openssh patch git >/dev/null && break
              [ "$attempt" -lt 3 ] || exit 1
              sleep 15
            done
            useradd -m tester
            cp -r /src /home/tester/omarchy-iso
            chown -R tester /home/tester/omarchy-iso
            cd /home/tester/omarchy-iso
            setpriv --reuid=tester --regid=tester --init-groups ./test/all
          '

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the Windows on Arm executable
        run: dotnet publish app -c Release -r win-arm64 --self-contained true -o out
      - uses: actions/upload-artifact@v4
        with:
          name: OmarchyArmInstaller
          path: out/OmarchyArmInstaller.exe
