name: Build

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the Windows on Arm executable
        run: dotnet publish app -c Release -r win-arm64 --self-contained true -o out
      - uses: actions/upload-artifact@v4
        with:
          name: OmarchyArmInstaller
          path: out/OmarchyArmInstaller.exe
